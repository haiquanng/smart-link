name: CI

# Fast checks on every branch push; PRs from this repo show them. Forks are not
# used. The slow local-Supabase suite lives in integration.yml.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:extension
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          # Placeholder: this build only checks that the bundle compiles.
          VITE_SUPABASE_ANON_KEY: build-check-anon-key
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Type-check edge functions
        working-directory: supabase/functions
        run: deno check */index.ts
