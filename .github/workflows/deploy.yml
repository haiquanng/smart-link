name: Deploy Supabase

# Production database and edge functions follow `main`. The frontend is
# deployed by Vercel's Git integration on the same push.
#
# No `supabase link`: it reads the project's API keys (incl. service_role),
# so the CI token would need that permission. Instead the database steps use
# --db-url (session pooler) and functions use --project-ref.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supabase:
    name: Migrations + edge functions
    runs-on: ubuntu-latest
    # Keep these secrets as *environment* secrets of `production`, limited to
    # the main branch, so no other workflow or branch can read them.
    environment: production
    env:
      # Token scopes: Edge Functions read-write (+ Project Settings read).
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Session pooler (IPv4, port 5432). Transaction mode (6543) breaks
      # migrations. From Dashboard -> Connect -> Session pooler.
      POOLER_HOST: aws-0-ap-southeast-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Build the database URL
        run: |
          # GitHub masks the raw secret only; the URL-encoded form can differ,
          # and CLI connection errors may print the URL. Mask both.
          encoded=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$encoded"
          url="postgresql://postgres.${PROJECT_REF}:${encoded}@${POOLER_HOST}:5432/postgres?sslmode=require"
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"

      # Production was first migrated by hand, so its history may be empty;
      # then `db push` would replay init. Stop instead (see development-workflow.md).
      - name: Guard against an empty remote migration history
        run: |
          # Ask the database directly: with --db-url the CLI prints a table,
          # not JSON. A missing history table counts as empty; any other
          # error (password, host) is reported as such, not as "empty".
          if ! applied=$(psql "$DB_URL" -tAc "select count(*) from supabase_migrations.schema_migrations" 2>&1); then
            if echo "$applied" | grep -q 'does not exist'; then
              applied=0
            else
              echo "::error::Cannot query the database. Check SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF and POOLER_HOST."
              exit 1
            fi
          fi
          echo "remote migrations recorded: $applied"
          if [ "$applied" -eq 0 ]; then
            echo "::error::Remote migration history is empty. Run 'supabase migration repair --status applied <versions>' once first."
            exit 1
          fi

      - name: Migrations to apply
        run: supabase db push --db-url "$DB_URL" --dry-run
      - run: supabase db push --db-url "$DB_URL"

      # verify_jwt per function comes from supabase/config.toml.
      - run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
