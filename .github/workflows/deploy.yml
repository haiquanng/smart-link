name: Deploy Supabase

# Production database and edge functions follow `main`. The frontend is
# deployed by Vercel's Git integration on the same push.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supabase:
    name: Migrations + edge functions
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase link --project-ref "$PROJECT_REF"

      # Production was first migrated by hand, so its history may be empty;
      # then `db push` would replay init. Stop instead (see development-workflow.md).
      - name: Guard against an empty remote migration history
        run: |
          applied=$(supabase migration list -o json | jq '[.migrations[] | select(.remote != "")] | length')
          echo "remote migrations recorded: $applied"
          if [ "$applied" -eq 0 ]; then
            echo "::error::Remote migration history is empty. Run 'supabase migration repair --status applied <versions>' once first."
            exit 1
          fi

      - run: supabase db push
      # verify_jwt per function comes from supabase/config.toml.
      - run: supabase functions deploy --use-api
